# catkeys - cat keyboard detector
# Per-user overrides go in ~/.config/catkeys/catkeys.conf

[catkeys]
# low, medium or high. Raise it if your cat is sneaky, lower it if you
# mash keys like a cat yourself.
sensitivity = medium

# Type this while locked to unlock straight away. Leave empty to disable.
unlock_word = human

# With nothing touching the keyboard for this long, it unlocks by itself.
quiet_seconds = 4

# Commands that make the compositor ignore / listen to keyboards again.
# "auto" knows sway. Leave empty to only get a notification.
lock_command = auto
unlock_command = auto

notify = true

# One notification text per line, picked at random.
messages_file = ~/.config/kitty-os/current/catkeys.txt
