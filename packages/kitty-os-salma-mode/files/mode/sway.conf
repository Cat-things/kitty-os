# Salma mode: peach accent, Salma wallpaper, Salma keys.
set $accent #fab387
set $wallpaper /usr/share/kitty-os/wallpapers/salma.png

# The Salma Files
bindsym $mod+p exec salma files open
# A random picture from The Salma Files as wallpaper
bindsym $mod+Shift+p exec salma files wallpaper
# Call her
bindsym $mod+m exec notify-send -a salma "meo-meo-meow" "$(salma call --quiet)"
